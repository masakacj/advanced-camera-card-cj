---
name: Semantic Release

# Publish this fork as a normal versioned HACS repository. Source changes on
# main are evaluated by semantic-release; commits that do not produce a new
# semantic version simply exit without publishing anything.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write # Create tags/releases and upload release assets
  issues: write # semantic-release issue comments
  pull-requests: write # semantic-release pull request comments

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  get-next-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: volta-cli/action@v4
      - run: yarn install --immutable
      - run: npx semantic-release --dry-run
        id: get-next-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.get-next-version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.get-next-version.outputs.new-release-git-tag }}

  release:
    runs-on: ubuntu-latest
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: volta-cli/action@v4
      - run: yarn install --immutable

      # Rollup chunk names contain hashes. Always build a release from an empty
      # dist directory so old chunks can never leak into HACS release assets.
      - name: Clean distribution
        run: rm -rf dist

      - name: Build release assets
        run: yarn run build
        env:
          RELEASE_VERSION: ${{ needs.get-next-version.outputs.new-release-version }}
          RELEASE_TAG: ${{ needs.get-next-version.outputs.new-release-git-tag }}

      - name: Create ZIP distribution
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          path: dist
          filename: advanced-camera-card.zip

      - name: Publish GitHub release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
