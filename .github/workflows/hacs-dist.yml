---
name: Build HACS Dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hacs-dist-main
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and Yarn
        uses: volta-cli/action@v4

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format
        run: yarn run format

      - name: Test
        run: yarn run test

      - name: Build
        shell: bash
        run: |
          # Rollup chunk filenames contain content hashes. The dist directory is
          # committed in this fork for HACS, so it must be cleaned before every
          # build or stale chunks from previous builds accumulate indefinitely.
          # HACS downloads every JS file it finds in dist for dashboard plugins.
          rm -rf dist
          yarn run build

      - name: Commit formatted source and HACS distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage any Prettier fixes first, then force-add the ignored dist output.
          # `git add -A` also records removal of stale dist chunks deleted before
          # the build, while the forced add makes sure the fresh ignored files are
          # included in the distribution commit.
          git add -A
          git add -f -A dist

          if git diff --cached --quiet; then
            echo "source and dist are already up to date"
          else
            git commit -m "build: update HACS distribution [skip ci]"
            git push
          fi

      # This is a personal fork/custom repository, so public-listing metadata
      # such as GitHub Topics and an enabled Issues tab are intentionally optional.
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: plugin
          ignore: hacs topics issues
