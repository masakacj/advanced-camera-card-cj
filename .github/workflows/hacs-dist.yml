---
name: Build HACS Dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

# Versioned GitHub Releases are the install source for HACS. This workflow is
# validation-only and must never move main while semantic-release is publishing.
permissions:
  contents: read

concurrency:
  group: hacs-dist-main
  cancel-in-progress: true

jobs:
  build:
    name: Validate HACS build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and Yarn
        uses: volta-cli/action@v4

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn run format-check

      - name: Test
        run: yarn run test

      - name: Build
        shell: bash
        run: |
          # Rollup chunk filenames contain content hashes. Always validate from
          # a clean output directory so stale chunks cannot hide packaging bugs.
          rm -rf dist
          yarn run build

      # This is a personal fork/custom repository, so public-listing metadata
      # such as GitHub Topics and an enabled Issues tab are intentionally optional.
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: plugin
          ignore: hacs topics issues
